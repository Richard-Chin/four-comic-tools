<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>邦拓 AI 陪練</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --rep:#2563eb; --cust:#334155; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  body{display:flex;flex-direction:column;max-width:720px;margin:0 auto}
  header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1}
  .badge{font-size:12px;color:var(--muted)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 14px;font-size:14px;background:var(--accent2);color:#001018;font-weight:600}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:not-allowed}
  /* 設定面板 */
  #setup{padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  #setup.hidden{display:none}
  .row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .field{flex:1;min-width:140px;display:flex;flex-direction:column;gap:4px}
  label{font-size:12px;color:var(--muted)}
  input,select{font-family:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--txt)}
  .hint{font-size:12px;color:var(--muted);line-height:1.5}
  /* 對話區 */
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:82%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .rep{align-self:flex-end;background:var(--rep);color:#fff;border-bottom-right-radius:4px}
  .cust{align-self:flex-start;background:var(--cust);border-bottom-left-radius:4px}
  .meta{align-self:center;font-size:12px;color:var(--muted)}
  .mood{font-size:11px;color:var(--muted);margin-top:3px}
  /* 評分卡 */
  .score{align-self:stretch;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .score h3{margin:0 0 8px;font-size:15px}
  .total{font-size:30px;font-weight:800}
  .bars{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .bar{display:flex;align-items:center;gap:8px;font-size:13px}
  .bar .name{width:64px;color:var(--muted)}
  .track{flex:1;height:8px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .fill{height:100%;background:var(--accent)}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;margin-top:6px}
  .tag.weak{background:rgba(245,158,11,.15);color:var(--warn)}
  .tag.mgr{background:rgba(239,68,68,.15);color:var(--bad)}
  /* 輸入區 */
  #composer{display:flex;gap:8px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
  #composer textarea{flex:1;resize:none;font-family:inherit;font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);max-height:120px}
  #err{color:var(--bad);font-size:13px;padding:0 16px}
</style>
</head>
<body>
<header>
  <h1>邦拓 AI 陪練</h1>
  <span class="badge" id="statusBadge">尚未開始</span>
  <button class="ghost" id="toggleSetup">設定</button>
</header>

<section id="setup">
  <div class="row">
    <div class="field" style="flex:2">
      <label>Webhook URL（V10 Production URL）</label>
      <input id="cfgUrl" placeholder="https://你的n8n網域/webhook/banto-roleplay-v10">
    </div>
    <div class="field">
      <label>x-banto-token</label>
      <input id="cfgToken" placeholder="banto-secret-2026">
    </div>
  </div>
  <div class="row">
    <div class="field"><label>業務員姓名</label><input id="cfgRep" value="測試業務"></div>
    <div class="field"><label>情境</label><input id="cfgScenario" value="家庭保障健檢"></div>
  </div>
  <div class="row">
    <div class="field">
      <label>客戶類型</label>
      <select id="cfgType">
        <option>理性精算型</option><option>防備冷淡型</option><option>感性家庭型</option>
      </select>
    </div>
    <div class="field">
      <label>難度</label>
      <select id="cfgDiff"><option>基礎</option><option selected>中階</option><option>進階</option></select>
    </div>
    <div class="field" style="justify-content:flex-end">
      <button id="startBtn">開始新局</button>
    </div>
  </div>
  <p class="hint">設定會存在本機瀏覽器。若送出時出現 CORS 錯誤：到 n8n Webhook 節點 → Options → <b>Allowed Origins (CORS)</b> 填 <code>*</code>（或你的網域）後重新啟用。</p>
</section>

<div id="chat"></div>
<div id="err"></div>

<div id="composer">
  <textarea id="input" rows="1" placeholder="輸入業務員的話…（Enter 送出，Shift+Enter 換行）" disabled></textarea>
  <button id="sendBtn" disabled>送出</button>
</div>

<script>
const $ = s => document.querySelector(s);
const chat = $('#chat'), errBox = $('#err');
const cfg = {
  url:$('#cfgUrl'), token:$('#cfgToken'), rep:$('#cfgRep'),
  scenario:$('#cfgScenario'), type:$('#cfgType'), diff:$('#cfgDiff')
};
let state = { sessionId:null, firstSent:false, busy:false };

// 跳脫使用者／伺服器文字，避免評分卡 innerHTML 被注入
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

// 讀取本機設定
try{
  const saved = JSON.parse(localStorage.getItem('banto_cfg')||'{}');
  if(saved.url) cfg.url.value = saved.url;
  if(saved.token) cfg.token.value = saved.token;
  if(saved.rep) cfg.rep.value = saved.rep;
}catch(e){}

function saveCfg(){
  try{ localStorage.setItem('banto_cfg', JSON.stringify({
    url:cfg.url.value.trim(), token:cfg.token.value.trim(), rep:cfg.rep.value.trim()
  })); }catch(e){}
}

function newSessionId(){
  return 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
}

function addMsg(text, cls, mood){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  if(mood){ const m=document.createElement('div'); m.className='mood'; m.textContent='情緒：'+mood; d.appendChild(m); }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function addMeta(text){
  const d=document.createElement('div'); d.className='meta'; d.textContent=text;
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
}

function showScore(r){
  const s = r.scores||{};
  const items = [['開場',s.opening],['提問',s.questioning],['需求',s.needs],['異議',s.objection],['收口',s.closing]];
  const card = document.createElement('div');
  card.className='score';
  card.innerHTML =
    '<h3>本局評分</h3>'+
    '<div class="total">'+ (r.total_score??'-') +'<span style="font-size:14px;color:var(--muted)"> / 100</span></div>'+
    '<div class="bars">'+ items.map(([n,v])=>
      '<div class="bar"><span class="name">'+n+'</span><span class="track"><span class="fill" style="width:'+(Number(v)||0)+'%"></span></span><span>'+(v??'-')+'</span></div>'
    ).join('') +'</div>'+
    (r.weakest_skill? '<span class="tag weak">主要弱項：'+esc(r.weakest_skill)+'</span> ':'')+
    (r.manager_required? '<span class="tag mgr">建議主管介入</span>':'')+
    (r.improvement? '<p class="hint" style="margin:8px 0 0">💡 '+esc(r.improvement)+'</p>':'');
  chat.appendChild(card); chat.scrollTop=chat.scrollHeight;
}

async function send(text){
  errBox.textContent='';
  if(state.busy) return;
  if(!cfg.url.value.trim()){ errBox.textContent='請先在「設定」填入 Webhook URL'; return; }
  state.busy = true; $('#sendBtn').disabled=true;
  addMsg(text,'rep');
  const typing = addMsg('客戶思考中…','cust');

  const body = state.firstSent
    ? { session_id:state.sessionId, rep_message:text }
    : { session_id:state.sessionId, rep_name:cfg.rep.value.trim()||'未命名業務',
        scenario:cfg.scenario.value.trim(), customer_type:cfg.type.value,
        difficulty:cfg.diff.value, rep_message:text };

  try{
    const res = await fetch(cfg.url.value.trim(), {
      method:'POST',
      headers:{'Content-Type':'application/json','x-banto-token':cfg.token.value.trim()},
      body: JSON.stringify(body)
    });
    // 先安全解析 JSON（後端若回非 JSON 也不炸）
    let data = {};
    try{ data = await res.json(); }catch(e){}
    typing.remove();
    // 統一處理非 2xx 回應，避免把錯誤當成功顯示「（無回應）」
    if(!res.ok){
      if(res.status===401){
        errBox.textContent='401：x-banto-token 不正確';
      }else{
        errBox.textContent='送出失敗（HTTP '+res.status+'）'+(data && data.message ? '：'+data.message : '，請確認 n8n 工作流程與網址');
      }
      state.busy=false; $('#sendBtn').disabled=false; return;
    }
    state.firstSent = true;
    addMsg(data.customer_reply || '（無回應）','cust', data.customer_mood);
    if(data.ended===true){
      showScore(data);
      addMeta('— 本局結束，可按上方「設定 → 開始新局」再來一局 —');
      $('#input').disabled=true; $('#sendBtn').disabled=true; $('#statusBadge').textContent='已結束';
    }else{
      $('#statusBadge').textContent='進行中（第 '+(data.next_round||'?')+' 輪）';
    }
  }catch(e){
    typing.remove();
    errBox.textContent='送出失敗：'+e.message+'（多半是 CORS 或網址錯誤，見設定區說明）';
  }
  state.busy=false; $('#sendBtn').disabled=false; $('#input').focus();
}

function startGame(){
  saveCfg();
  if(!cfg.url.value.trim()){ errBox.textContent='請先填 Webhook URL'; return; }
  state.sessionId = newSessionId();
  state.firstSent = false;
  chat.innerHTML=''; errBox.textContent='';
  addMeta('新局開始 · '+cfg.scenario.value+' · '+cfg.type.value+' · '+cfg.diff.value);
  $('#input').disabled=false; $('#sendBtn').disabled=false;
  $('#input').focus();
  $('#statusBadge').textContent='進行中（第 1 輪）';
  $('#setup').classList.add('hidden');
}

$('#startBtn').addEventListener('click', startGame);
$('#toggleSetup').addEventListener('click', ()=> $('#setup').classList.toggle('hidden'));
$('#sendBtn').addEventListener('click', ()=>{
  const t=$('#input').value.trim(); if(!t) return; $('#input').value=''; $('#input').style.height='auto'; send(t);
});
$('#input').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('#sendBtn').click(); }
});
$('#input').addEventListener('input', e=>{ e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'; });
</script>
</body>
</html>
